

    <div class="modal-ventas">

    <div class="modal-header">
        <h2>🍽 Realizar Pedido</h2>
        <p>Complete la información para registrar su compra.</p>
    </div>

    <form id="formVentas" autocomplete="off">

        <!-- Datos del Cliente -->

        <div class="form-section">

            <h3>Datos del Cliente</h3>

            <div class="form-group input-check">
                <label for="cliente">
                    Nombre Completo
                </label>

                <input
                    type="text"
                    id="cliente"
                    placeholder="Ejemplo: Juan Pérez"
                    required>

    <img
        class="check-icon"
        src="../../Imagenes/Check_logo.png"
        alt="Estado">
            </div>

            <div class="form-group input-check">
                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    placeholder="8888-8888"
                    pattern="[0-9]{4}-?[0-9]{4}"
                    required>

    <img
        class="check-icon"
        src="../../Imagenes/Check_logo.png"
        alt="Estado">
            </div>

        </div>

        <!-- Pedido -->

        <div class="form-section">

            <h3>Pedido</h3>

            <div class="form-group input-check">

                <label for="producto">

                    Producto

                </label>

                <textarea
                    id="producto"
                    rows="5"
                    readonly></textarea>

    <img
        class="check-icon"
        src="../../Imagenes/Check_logo.png"
        alt="Estado">

            </div>

            <div class="form-row">

                <div class="form-group input-check">

                    <label for="cantidad">

                        Cantidad

                    </label>

                    <input
                        type="number"
                        id="cantidad"
                        value="1"
                        min="1" 
                        required>

                    <img
                        class="check-icon"
                        src="../../Imagenes/Check_logo.png"
                        alt="Estado">

                </div>

                <div class="form-group input-check">

                    <label for="precio">

                        Subtotal

                    </label>

                    <input
                        type="text"
                        id="precio"
                        readonly>

                    <img
                    class="check-icon"
                    src="../../Imagenes/Check_logo.png"
                    alt="Estado">

                </div>

            </div>

            <div class="form-group input-check">

                <label for="observaciones">

                    Observaciones

                </label>

                <textarea
                    id="observaciones"
                    rows="4"
                    placeholder="Sin cebolla, extra queso, etc."></textarea>

            </div>

        </div>

        <!-- Pago -->

        <div class="form-section">

            <h3>Pago</h3>

            <div class="form-group input-check">

                <label for="metodo">

                    Método de Pago

                </label>

                <select id="metodo" name="metodo">

                    <option>Efectivo</option>

                    <option>Tarjeta</option>

                    <option>Transferencia</option>

                </select>

    <img
        class="check-icon"
        src="../../Imagenes/Check_logo.png"
        alt="Estado">

            </div>

            <div class="form-group input-check">

                    <label for="">Total</label>
                    <input type="text" id="total" readonly>
                


            </div>

        </div>

        <div class="acciones">

            <button
                type="submit"
                class="btn-primary-seleccion"
                >

                <b>Confirmar Pedido</b>

            </button>

            <button
                type="button"
                class="btn-secondary-stuff"
                id="cancelar">

                <b>Cancelar</b>

            </button>

        </div>

    </form>

</div>
