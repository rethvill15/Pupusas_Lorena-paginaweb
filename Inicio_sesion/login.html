<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFBEB">
    <title>Iniciar sesión - Pupusas Lorena</title>
    <link rel="icon" href="../Imagenes/pupusas_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS_archivos/detalles.css">
    <link rel="stylesheet" href="../CSS_archivos/nav_usuario.css?v=2">
    <link rel="stylesheet" href="login.css?v=2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="login-page">
    <header class="navbar"><div class="nav-container">
<a href="../pup_lorena.html" class="logo"><img src="../Imagenes/images.png" alt="Logo Pupusas Lorena" class="logo-img"><span class="logo-texto">Pupusas Lorena</span></a>
<nav class="nav-links" aria-label="Navegación principal"><a href="../pup_lorena.html" class="nav-item">Inicio</a>
<a href="../Menu_pupusas/menu_seccion.html" class="nav-item">Menú</a>
<a href="../Historia_seccion/historia_pagi.html" class="nav-item">Nuestra Historia</a>
<a href="../Eventos/eventos_pagi.html" class="nav-item">Eventos</a>
<div class="usuario-nav" id="usuarioNav" data-base="../"><a class="nav-item" href="../Inicio_sesion/login.html">Iniciar sesión</a><a class="nav-item" href="../Registro_usuario/Registro_user.html">Crear cuenta</a></div>
<a href="../Menu_pupusas/menu_seccion.html" class="btn-nav">Ver menú</a></nav></div></header>
    <main class="login-main">
        <section class="login-card">
            <div class="login-icono" aria-hidden="true"><i class="bi bi-person-circle"></i></div>
            <span class="etiqueta-superior">QUÉ GUSTO TENERTE AQUÍ</span>
            <h1>Iniciar sesión</h1>
            <p class="login-descripcion">Ingresa a tu cuenta de Pupusas Lorena.</p>
            <form id="loginForm">
                <div class="campo-login">
                    <label for="correo">Correo electrónico</label>
                    <div class="input-con-icono"><i class="bi bi-envelope" aria-hidden="true"></i><input type="email" id="correo" name="correo" placeholder="Ej. usuario@correo.com" autocomplete="email" required></div>
                </div>
                <div class="campo-login">
                    <label for="password">Contraseña</label>
                    <div class="input-con-icono"><i class="bi bi-lock" aria-hidden="true"></i><input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required></div>
                </div>
                <button type="submit" class="boton-login">Iniciar sesión <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
            </form>
            <p class="crear-cuenta">¿No tienes una cuenta? <a href="../Registro_usuario/Registro_user.html">Crear una cuenta</a></p>
        </section>
        <p class="login-nota"><i class="bi bi-heart-fill" aria-hidden="true"></i> Gracias por ser parte de Pupusas Lorena.</p>
    </main>
    <script src="../JS_archivos/nav_usuario.js?v=2"></script>
    <script src="../JS_archivos/login.js?v=4"></script>
</body>
</html>
